name: Update football data

on:
  schedule:
    - cron: "12 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-football-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download competitions, matches, standings and scorers
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
        run: |
          python <<'PYTHON'
          import json
          import os
          import time
          import urllib.request
          from datetime import datetime, timezone
          from pathlib import Path

          API = "https://api.football-data.org/v4"
          TOKEN = os.environ["FOOTBALL_DATA_TOKEN"]
          COMPETITIONS = ["PD", "PL", "SA", "FL1"]
          OUTPUT = Path("public/data/index.json")
          OUTPUT.parent.mkdir(parents=True, exist_ok=True)

          def get_json(path):
              url = f"{API}{path}"
              request = urllib.request.Request(
                  url,
                  headers={
                      "X-Auth-Token": TOKEN,
                      "Accept": "application/json",
                      "User-Agent": "FootballGitHubApp/1.0",
                  },
              )
              with urllib.request.urlopen(request, timeout=60) as response:
                  return json.loads(response.read().decode("utf-8"))

          result = {
              "updatedAt": datetime.now(timezone.utc).isoformat(),
              "source": "football-data.org",
              "competitions": {},
          }

          for code in COMPETITIONS:
              print(f"Downloading {code}")
              competition = get_json(f"/competitions/{code}")
              time.sleep(7)
              matches = get_json(f"/competitions/{code}/matches")
              time.sleep(7)
              standings = get_json(f"/competitions/{code}/standings")
              time.sleep(7)
              scorers = get_json(f"/competitions/{code}/scorers?limit=100")
              time.sleep(7)

              result["competitions"][code] = {
                  "competition": competition,
                  "matches": matches,
                  "standings": standings,
                  "scorers": scorers,
              }

          with OUTPUT.open("w", encoding="utf-8") as file:
              json.dump(result, file, ensure_ascii=False, separators=(",", ":"))

          print("Football data generated successfully")
          PYTHON

      - name: Verify JSON
        run: python -m json.tool public/data/index.json > /dev/null

      - name: Commit football data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/index.json

          if git diff --cached --quiet; then
            echo "No football data changes"
            exit 0
          fi

          git commit -m "Update football data"
          git pull --rebase origin main
          git push origin main
