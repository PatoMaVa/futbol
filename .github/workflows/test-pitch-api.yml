name: Test PitchAPI

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Test PitchAPI
        env:
          PITCH_API_KEY: ${{ secrets.PITCH_API_KEY }}
        run: |
          python <<'PYTHON'
          import json
          import os
          import urllib.request
          from datetime import datetime, timezone, timedelta

          API = "https://api.pitchapi.dev/v1"
          KEY = os.environ["PITCH_API_KEY"]

          def get_json(path):
              url = f"{API}{path}"

              print("")
              print(f"Requesting: {url}")

              request = urllib.request.Request(
                  url,
                  headers={
                      "X-API-KEY": KEY,
                      "Accept": "application/json",
                      "User-Agent": "FootballGitHubApp/1.0",
                  },
              )

              with urllib.request.urlopen(
                  request,
                  timeout=60,
              ) as response:
                  return json.loads(
                      response
                      .read()
                      .decode("utf-8")
                  )

          print("================================")
          print("PITCHAPI TEST")
          print("================================")

          leagues_response = get_json(
              "/leagues"
          )

          leagues = (
              leagues_response
              .get("data", {})
              .get("leagues", [])
          )

          print("")
          print(
              "Leagues available:",
              len(leagues),
          )

          wanted = {
              "premier league",
              "la liga",
              "laliga",
              "serie a",
              "ligue 1",
          }

          print("")
          print("Relevant leagues:")

          relevant_leagues = []

          for league in leagues:
              name = (
                  league
                  .get("name", "")
                  .lower()
              )

              if (
                  name in wanted
                  or "premier league" in name
                  or "serie a" in name
                  or "ligue 1" in name
                  or "la liga" in name
                  or "laliga" in name
              ):
                  relevant_leagues.append(
                      league
                  )

                  print(
                      json.dumps(
                          league,
                          ensure_ascii=False,
                      )
                  )

          print("")
          print("================================")
          print("SEARCHING RECENT MATCHES")
          print("================================")

          today = datetime.now(
              timezone.utc
          ).date()

          selected_match = None

          for days_back in range(0, 8):
              date = (
                  today
                  - timedelta(
                      days=days_back
                  )
              )

              date_string = (
                  date.isoformat()
              )

              response = get_json(
                  f"/date/{date_string}"
              )

              matches = (
                  response
                  .get("data", {})
                  .get("matches", [])
              )

              print(
                  f"{date_string}: "
                  f"{len(matches)} matches"
              )

              for match in matches:
                  league = (
                      match.get("league")
                      or {}
                  )

                  league_name = (
                      league
                      .get("name", "")
                      .lower()
                  )

                  status = (
                      match
                      .get("status", "")
                      .lower()
                  )

                  if (
                      (
                          "premier league"
                          in league_name
                          or "serie a"
                          in league_name
                          or "ligue 1"
                          in league_name
                          or "la liga"
                          in league_name
                          or "laliga"
                          in league_name
                      )
                      and status
                      in [
                          "finished",
                          "complete",
                          "completed",
                      ]
                  ):
                      selected_match = (
                          match
                      )
                      break

              if selected_match:
                  break

          if not selected_match:
              print("")
              print(
                  "No recent completed target-league "
                  "match found."
              )

              print(
                  "League discovery succeeded, "
                  "but event test could not run."
              )

              raise SystemExit(0)

          print("")
          print("================================")
          print("MATCH FOUND")
          print("================================")

          print(
              json.dumps(
                  selected_match,
                  ensure_ascii=False,
                  indent=2,
              )
          )

          match_id = (
              selected_match["id"]
          )

          print("")
          print(
              "Match ID:",
              match_id
          )

          print("")
          print("================================")
          print("MATCH DETAIL")
          print("================================")

          match_detail = get_json(
              f"/matches/{match_id}"
          )

          print(
              json.dumps(
                  match_detail,
                  ensure_ascii=False,
                  indent=2,
              )
          )

          print("")
          print("================================")
          print("EVENTS")
          print("================================")

          events_response = get_json(
              f"/matches/{match_id}/events"
          )

          events = (
              events_response
              .get("data", {})
              .get("events", [])
          )

          print(
              f"Events found: "
              f"{len(events)}"
          )

          for event in events:
              print(
                  json.dumps(
                      event,
                      ensure_ascii=False,
                  )
              )

          goals = [
              event
              for event in events
              if (
                  event
                  .get(
                      "event_type",
                      "",
                  )
                  .lower()
                  == "goal"
              )
          ]

          yellow_cards = [
              event
              for event in events
              if (
                  event
                  .get(
                      "event_type",
                      "",
                  )
                  .lower()
                  == "yellowcard"
              )
          ]

          red_cards = [
              event
              for event in events
              if (
                  event
                  .get(
                      "event_type",
                      "",
                  )
                  .lower()
                  == "redcard"
              )
          ]

          substitutions = [
              event
              for event in events
              if (
                  event
                  .get(
                      "event_type",
                      "",
                  )
                  .lower()
                  == "substitution"
              )
          ]

          print("")
          print("================================")
          print("SUMMARY")
          print("================================")

          print(
              "Goals:",
              len(goals)
          )

          print(
              "Yellow cards:",
              len(yellow_cards)
          )

          print(
              "Red cards:",
              len(red_cards)
          )

          print(
              "Substitutions:",
              len(substitutions)
          )

          if events:
              print("")
              print(
                  "SUCCESS: PitchAPI event data "
                  "is available."
              )
          else:
              print("")
              print(
                  "PitchAPI returned the match, "
                  "but this match has no events."
              )
          PYTHON
