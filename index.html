<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />

    <meta
      name="description"
      content="Resultados, clasificaciones y estadísticas de LaLiga, Premier, Serie A y Ligue 1"
    />

    <meta
      name="theme-color"
      content="#166534"
    />

    <meta
      name="apple-mobile-web-app-capable"
      content="yes"
    />

    <meta
      name="mobile-web-app-capable"
      content="yes"
    />

    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="default"
    />

    <meta
      name="apple-mobile-web-app-title"
      content="Fútbol"
    />

    <!-- Icono específico para iPhone/iPad -->
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/futbol/apple-touch-icon-v2.png"
    />

    <!-- Iconos generales -->
    <link
      rel="icon"
      type="image/png"
      sizes="192x192"
      href="/futbol/icon-192.png"
    />

    <link
      rel="icon"
      type="image/png"
      sizes="512x512"
      href="/futbol/icon-512.png"
    />

    <!-- PWA -->
    <link
      rel="manifest"
      href="/futbol/manifest.webmanifest"
    />

    <title>Fútbol · Resultados y estadísticas</title>
  </head>

  <body>
    <div id="root"></div>

    <script
      type="module"
      src="/src/main.jsx"
