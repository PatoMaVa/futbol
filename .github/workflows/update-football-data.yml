name: Update football data

on:
  schedule:
    - cron: "12 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-football-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download football data and match events
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
          PITCH_API_KEY: ${{ secrets.PITCH_API_KEY }}
        run: |
          python <<'PYTHON'
          import json
          import os
          import re
          import time
          import unicodedata
          import urllib.error
          import urllib.parse
          import urllib.request

          from datetime import datetime, timezone
          from difflib import SequenceMatcher
          from pathlib import Path

          FOOTBALL_API = (
              "https://api.football-data.org/v4"
          )

          PITCH_API = (
              "https://api.pitchapi.dev/v1"
          )

          FOOTBALL_TOKEN = os.environ[
              "FOOTBALL_DATA_TOKEN"
          ]

          PITCH_TOKEN = os.environ[
              "PITCH_API_KEY"
          ]

          COMPETITIONS = [
              "PD",
              "PL",
              "SA",
              "FL1",
          ]

          OUTPUT = Path(
              "public/data/index.json"
          )

          OUTPUT.parent.mkdir(
              parents=True,
              exist_ok=True,
          )

          previous_data = {}

          if OUTPUT.exists():
              try:
                  with OUTPUT.open(
                      "r",
                      encoding="utf-8",
                  ) as file:
                      previous_data = json.load(
                          file
                      )

              except Exception as error:
                  print(
                      "Could not read previous data:",
                      error,
                  )

          previous_match_details = (
              previous_data.get(
                  "matchDetails",
                  {},
              )
          )

          previous_pitch_events = (
              previous_data.get(
                  "pitchEvents",
                  {},
              )
          )

          def normalize_text(value):
              value = str(
                  value or ""
              )

              value = unicodedata.normalize(
                  "NFD",
                  value,
              )

              value = "".join(
                  character
                  for character in value
                  if unicodedata.category(
                      character
                  ) != "Mn"
              )

              value = value.lower()

              replacements = {
                  "&": " and ",
                  "utd": "united",
                  "man utd": (
                      "manchester united"
                  ),
                  "man city": (
                      "manchester city"
                  ),
                  "inter milan": (
                      "internazionale"
                  ),
                  "inter": (
                      "internazionale"
                  ),
                  "ac milan": "milan",
                  "psg": (
                      "paris saint germain"
                  ),
                  "atleti": (
                      "atletico madrid"
                  ),
                  "athletic club": (
                      "athletic bilbao"
                  ),
                  "real betis balompie": (
                      "real betis"
                  ),
                  "rcd espanyol": (
                      "espanyol"
                  ),
                  "deportivo alaves": (
                      "alaves"
                  ),
                  "rc celta": (
                      "celta vigo"
                  ),
                  "hellas verona": (
                      "verona"
                  ),
                  "olympique lyonnais": (
                      "lyon"
                  ),
                  "olympique de marseille": (
                      "marseille"
                  ),
              }

              for old, new in (
                  replacements.items()
              ):
                  value = value.replace(
                      old,
                      new,
                  )

              value = re.sub(
                  r"\b("
                  r"fc|cf|ac|sc|afc|"
                  r"football club|"
                  r"calcio|club de futbol"
                  r")\b",
                  " ",
                  value,
              )

              value = re.sub(
                  r"[^a-z0-9]+",
                  " ",
                  value,
              )

              return re.sub(
                  r"\s+",
                  " ",
                  value,
              ).strip()

          def similarity(first, second):
              first_normalized = (
                  normalize_text(first)
              )

              second_normalized = (
                  normalize_text(second)
              )

              if (
                  not first_normalized
                  or not second_normalized
              ):
                  return 0

              if (
                  first_normalized
                  == second_normalized
              ):
                  return 1

              if (
                  first_normalized
                  in second_normalized
                  or second_normalized
                  in first_normalized
              ):
                  return 0.93

              return SequenceMatcher(
                  None,
                  first_normalized,
                  second_normalized,
              ).ratio()

          def football_get(path):
              url = (
                  f"{FOOTBALL_API}{path}"
              )

              print(
                  f"football-data.org: {url}"
              )

              request = (
                  urllib.request.Request(
                      url,
                      headers={
                          "X-Auth-Token": (
                              FOOTBALL_TOKEN
                          ),
                          "Accept": (
                              "application/json"
                          ),
                          "User-Agent": (
                              "FootballGitHubApp/"
                              "3.0"
                          ),
                      },
                  )
              )

              last_error = None

              for attempt in range(
                  1,
                  4,
              ):
                  try:
                      with urllib.request.urlopen(
                          request,
                          timeout=60,
                      ) as response:
                          result = json.loads(
                              response
                              .read()
                              .decode(
                                  "utf-8"
                              )
                          )

                      # El plan gratuito permite
                      # aproximadamente 10 llamadas
                      # por minuto.
                      time.sleep(7)

                      return result

                  except urllib.error.HTTPError as error:
                      last_error = error

                      print(
                          "football-data.org "
                          f"HTTP {error.code}"
                      )

                      if error.code == 429:
                          time.sleep(65)
                      elif attempt < 3:
                          time.sleep(15)

                  except Exception as error:
                      last_error = error

                      if attempt < 3:
                          time.sleep(15)

              raise RuntimeError(
                  "football-data.org "
                  f"failed: {last_error}"
              )

          def pitch_get(path):
              url = (
                  f"{PITCH_API}{path}"
              )

              print(
                  f"PitchAPI: {url}"
              )

              request = (
                  urllib.request.Request(
                      url,
                      headers={
                          "X-API-KEY": (
                              PITCH_TOKEN
                          ),
                          "Accept": (
                              "application/json"
                          ),
                          "User-Agent": (
                              "FootballGitHubApp/"
                              "3.0"
                          ),
                      },
                  )
              )

              last_error = None

              for attempt in range(
                  1,
                  4,
              ):
                  try:
                      with urllib.request.urlopen(
                          request,
                          timeout=60,
                      ) as response:
                          result = json.loads(
                              response
                              .read()
                              .decode(
                                  "utf-8"
                              )
                          )

                      time.sleep(0.5)

                      return result

                  except urllib.error.HTTPError as error:
                      last_error = error

                      print(
                          "PitchAPI "
                          f"HTTP {error.code}"
                      )

                      if error.code == 429:
                          retry_after = int(
                              error.headers.get(
                                  "Retry-After",
                                  "10",
                              )
                          )

                          time.sleep(
                              retry_after
                          )

                      elif attempt < 3:
                          time.sleep(5)

                  except Exception as error:
                      last_error = error

                      if attempt < 3:
                          time.sleep(5)

              raise RuntimeError(
                  f"PitchAPI failed: "
                  f"{last_error}"
              )

          def matchday_summary(matches):
              summary = {}

              for match in matches:
                  matchday = match.get(
                      "matchday"
                  )

                  if matchday is None:
                      continue

                  summary.setdefault(
                      matchday,
                      {
                          "total": 0,
                          "finished": 0,
                          "started": 0,
                          "scheduled": 0,
                      },
                  )

                  item = summary[
                      matchday
                  ]

                  status = match.get(
                      "status"
                  )

                  item["total"] += 1

                  if status == "FINISHED":
                      item["finished"] += 1

                  if status in [
                      "FINISHED",
                      "IN_PLAY",
                      "PAUSED",
                  ]:
                      item["started"] += 1

                  if status in [
                      "SCHEDULED",
                      "TIMED",
                  ]:
                      item["scheduled"] += 1

              return summary

          def find_last_matchday(matches):
              summary = (
                  matchday_summary(
                      matches
                  )
              )

              completed = [
                  matchday
                  for matchday, item
                  in summary.items()
                  if (
                      item["finished"] > 0
                      and item["started"]
                      == item["total"]
                  )
              ]

              if completed:
                  return max(completed)

              partially_completed = [
                  match.get("matchday")
                  for match in matches
                  if (
                      match.get("status")
                      == "FINISHED"
                      and match.get(
                          "matchday"
                      )
                      is not None
                  )
              ]

              return (
                  max(
                      partially_completed
                  )
                  if partially_completed
                  else None
              )

          def find_next_matchday(
              matches,
              current_matchday,
          ):
              upcoming = sorted(
                  {
                      match.get("matchday")
                      for match in matches
                      if (
                          match.get(
                              "matchday"
                          )
                          is not None
                          and match.get(
                              "status"
                          )
                          in [
                              "SCHEDULED",
                              "TIMED",
                          ]
                      )
                  }
              )

              if current_matchday is not None:
                  current_or_later = [
                      matchday
                      for matchday
                      in upcoming
                      if matchday
                      >= current_matchday
                  ]

                  if current_or_later:
                      return min(
                          current_or_later
                      )

              return (
                  upcoming[0]
                  if upcoming
                  else None
              )

          def get_pitch_matches_for_date(
              date_string,
              pitch_date_cache,
          ):
              if (
                  date_string
                  in pitch_date_cache
              ):
                  return (
                      pitch_date_cache[
                          date_string
                      ]
                  )

              response = pitch_get(
                  f"/date/{date_string}"
              )

              matches = (
                  response
                  .get("data", {})
                  .get("matches", [])
              )

              pitch_date_cache[
                  date_string
              ] = matches

              print(
                  f"PitchAPI {date_string}: "
                  f"{len(matches)} matches"
              )

              return matches

          def pitch_match_score(
              football_match,
              pitch_match,
          ):
              football_home = (
                  football_match
                  .get(
                      "homeTeam",
                      {},
                  )
                  .get("name", "")
              )

              football_away = (
                  football_match
                  .get(
                      "awayTeam",
                      {},
                  )
                  .get("name", "")
              )

              pitch_home = (
                  pitch_match
                  .get(
                      "home_team",
                      {},
                  )
                  .get("name", "")
              )

              pitch_away = (
                  pitch_match
                  .get(
                      "away_team",
                      {},
                  )
                  .get("name", "")
              )

              home_score = similarity(
                  football_home,
                  pitch_home,
              )

              away_score = similarity(
                  football_away,
                  pitch_away,
              )

              name_score = (
                  home_score
                  + away_score
              ) / 2

              football_date = (
                  football_match
                  .get("utcDate", "")[
                      :10
                  ]
              )

              pitch_date = (
                  pitch_match
                  .get("time_utc", "")[
                      :10
                  ]
              )

              if (
                  football_date
                  != pitch_date
              ):
                  return 0

              football_home_goals = (
                  football_match
                  .get("score", {})
                  .get("fullTime", {})
                  .get("home")
              )

              football_away_goals = (
                  football_match
                  .get("score", {})
                  .get("fullTime", {})
                  .get("away")
              )

              pitch_home_goals = (
                  pitch_match.get(
                      "score_home"
                  )
              )

              pitch_away_goals = (
                  pitch_match.get(
                      "score_away"
                  )
              )

              score_bonus = 0

              if (
                  football_home_goals
                  is not None
                  and football_away_goals
                  is not None
                  and pitch_home_goals
                  is not None
                  and pitch_away_goals
                  is not None
              ):
                  if (
                      int(
                          football_home_goals
                      )
                      == int(
                          pitch_home_goals
                      )
                      and int(
                          football_away_goals
                      )
                      == int(
                          pitch_away_goals
                      )
                  ):
                      score_bonus = 0.25
                  else:
                      score_bonus = -0.25

              return (
                  name_score
                  + score_bonus
              )

          def find_pitch_match(
              football_match,
              pitch_matches,
          ):
              candidates = []

              for pitch_match in (
                  pitch_matches
              ):
                  score = pitch_match_score(
                      football_match,
                      pitch_match,
                  )

                  candidates.append(
                      (
                          score,
                          pitch_match,
                      )
                  )

              candidates.sort(
                  key=lambda item:
                      item[0],
                  reverse=True,
              )

              if not candidates:
                  return None, 0

              best_score, best_match = (
                  candidates[0]
              )

              # Con marcador coincidente suele
              # superar 0,80. Sin marcador se
              # exige similitud suficiente en
              # ambos equipos.
              if best_score < 0.68:
                  return None, best_score

              return (
                  best_match,
                  best_score,
              )

          result = {
              "updatedAt": datetime.now(
                  timezone.utc
              ).isoformat(),
              "source": {
                  "fixtures": (
                      "football-data.org"
                  ),
                  "events": "PitchAPI",
              },
              "competitions": {},
              "matchDetails": (
                  previous_match_details
              ),
              "pitchEvents": (
                  previous_pitch_events
              ),
          }

          relevant_matches = []
          relevant_football_ids = set()

          for code in COMPETITIONS:
              print("")
              print(
                  "========================"
              )
              print(
                  f"DOWNLOADING {code}"
              )
              print(
                  "========================"
              )

              competition = football_get(
                  f"/competitions/{code}"
              )

              matches_data = football_get(
                  f"/competitions/{code}"
                  "/matches"
              )

              standings = football_get(
                  f"/competitions/{code}"
                  "/standings"
              )

              scorers = football_get(
                  f"/competitions/{code}"
                  "/scorers?limit=100"
              )

              all_matches = (
                  matches_data.get(
                      "matches",
                      [],
                  )
              )

              current_matchday = (
                  competition
                  .get(
                      "currentSeason",
                      {},
                  )
                  .get(
                      "currentMatchday"
                  )
              )

              last_matchday = (
                  find_last_matchday(
                      all_matches
                  )
              )

              next_matchday = (
                  find_next_matchday(
                      all_matches,
                      current_matchday,
                  )
              )

              last_matches = [
                  match
                  for match in all_matches
                  if (
                      match.get(
                          "matchday"
                      )
                      == last_matchday
                      and match.get(
                          "status"
                      )
                      == "FINISHED"
                  )
              ]

              live_matches = [
                  match
                  for match in all_matches
                  if match.get(
                      "status"
                  )
                  in [
                      "IN_PLAY",
                      "PAUSED",
                  ]
              ]

              next_matches = [
                  match
                  for match in all_matches
                  if (
                      match.get(
                          "matchday"
                      )
                      == next_matchday
                      and match.get(
                          "status"
                      )
                      in [
                          "SCHEDULED",
                          "TIMED",
                      ]
                  )
              ]

              selected_by_id = {}

              for match in (
                  last_matches
                  + live_matches
                  + next_matches
              ):
                  selected_by_id[
                      str(match["id"])
                  ] = match

              selected_matches = list(
                  selected_by_id.values()
              )

              selected_matches.sort(
                  key=lambda match:
                      match.get(
                          "utcDate",
                          "",
                      )
              )

              result[
                  "competitions"
              ][code] = {
                  "competition": (
                      competition
                  ),
                  "matches": {
                      **matches_data,
                      "matches": (
                          selected_matches
                      ),
                  },
                  "lastMatchday": (
                      last_matchday
                  ),
                  "nextMatchday": (
                      next_matchday
                  ),
                  "lastMatches": (
                      last_matches
                  ),
                  "liveMatches": (
                      live_matches
                  ),
                  "nextMatches": (
                      next_matches
                  ),
                  "standings": standings,
                  "scorers": scorers,
              }

              for match in (
                  last_matches
                  + live_matches
              ):
                  relevant_matches.append(
                      match
                  )

                  relevant_football_ids.add(
                      str(match["id"])
                  )

              print(
                  f"{code}: "
                  f"last day "
                  f"{last_matchday} "
                  f"({len(last_matches)}), "
                  f"live "
                  f"{len(live_matches)}, "
                  f"next day "
                  f"{next_matchday} "
                  f"({len(next_matches)})"
              )

          # Recuperar información ampliada de
          # football-data.org en una única
          # petición mediante ids.
          match_ids = sorted(
              relevant_football_ids
          )

          if match_ids:
              ids_parameter = ",".join(
                  match_ids
              )

              try:
                  detailed_matches = (
                      football_get(
                          "/matches?ids="
                          + urllib.parse.quote(
                              ids_parameter
                          )
                      )
                      .get(
                          "matches",
                          [],
                      )
                  )

                  for match in (
                      detailed_matches
                  ):
                      result[
                          "matchDetails"
                      ][str(match["id"])] = (
                          match
                      )

                  print(
                      "football-data.org "
                      "detailed matches:",
                      len(
                          detailed_matches
                      ),
                  )

              except Exception as error:
                  print(
                      "Could not download "
                      "football-data.org "
                      f"details: {error}"
                  )

          pitch_date_cache = {}

          pitch_matches_found = 0
          pitch_matches_missing = 0
          pitch_events_downloaded = 0
          pitch_events_reused = 0

          for football_match in (
              relevant_matches
          ):
              football_id = str(
                  football_match["id"]
              )

              status = (
                  football_match.get(
                      "status"
                  )
              )

              existing_event_data = (
                  result[
                      "pitchEvents"
                  ].get(
                      football_id
                  )
              )

              if (
                  status == "FINISHED"
                  and existing_event_data
                  and existing_event_data
                  .get("complete")
              ):
                  print(
                      f"Match {football_id}: "
                      "using saved PitchAPI "
                      "events"
                  )

                  pitch_events_reused += 1
                  continue

              date_string = (
                  football_match
                  .get("utcDate", "")[
                      :10
                  ]
              )

              if not date_string:
                  continue

              try:
                  pitch_matches = (
                      get_pitch_matches_for_date(
                          date_string,
                          pitch_date_cache,
                      )
                  )

                  (
                      pitch_match,
                      matching_score,
                  ) = find_pitch_match(
                      football_match,
                      pitch_matches,
                  )

                  if not pitch_match:
                      pitch_matches_missing += 1

                      print(
                          f"Match {football_id}: "
                          "no PitchAPI match "
                          "found. Best score: "
                          f"{matching_score:.3f}"
                      )

                      continue

                  pitch_matches_found += 1

                  pitch_id = (
                      pitch_match["id"]
                  )

                  print(
                      f"Match {football_id}: "
                      f"PitchAPI {pitch_id}, "
                      "matching score "
                      f"{matching_score:.3f}"
                  )

                  events_response = (
                      pitch_get(
                          f"/matches/"
                          f"{pitch_id}/events"
                      )
                  )

                  events = (
                      events_response
                      .get("data", {})
                      .get("events", [])
                  )

                  result[
                      "pitchEvents"
                  ][football_id] = {
                      "footballMatchId": (
                          football_id
                      ),
                      "pitchMatchId": (
                          pitch_id
                      ),
                      "matchingScore": (
                          round(
                              matching_score,
                              4,
                          )
                      ),
                      "complete": (
                          status
                          == "FINISHED"
                      ),
                      "updatedAt": (
                          datetime.now(
                              timezone.utc
                          ).isoformat()
                      ),
                      "pitchMatch": (
                          pitch_match
                      ),
                      "events": events,
                  }

                  pitch_events_downloaded += 1

                  print(
                      f"Match {football_id}: "
                      f"{len(events)} events"
                  )

              except Exception as error:
                  print(
                      f"Match {football_id}: "
                      "PitchAPI failed: "
                      f"{error}"
                  )

          # Conservar únicamente los partidos
          # actualmente presentes en la app.
          visible_match_ids = {
              str(match["id"])
              for competition_data
              in result[
                  "competitions"
              ].values()
              for match
              in competition_data
              .get("matches", {})
              .get("matches", [])
          }

          result["matchDetails"] = {
              match_id: detail
              for match_id, detail
              in result[
                  "matchDetails"
              ].items()
              if match_id
              in visible_match_ids
          }

          result["pitchEvents"] = {
              match_id: event_data
              for match_id, event_data
              in result[
                  "pitchEvents"
              ].items()
              if match_id
              in visible_match_ids
          }

          with OUTPUT.open(
              "w",
              encoding="utf-8",
          ) as file:
              json.dump(
                  result,
                  file,
                  ensure_ascii=False,
                  separators=(",", ":"),
              )

          print("")
          print(
              "========================"
          )
          print("UPDATE SUMMARY")
          print(
              "========================"
          )

          print(
              "Pitch matches found:",
              pitch_matches_found,
          )

          print(
              "Pitch matches missing:",
              pitch_matches_missing,
          )

          print(
              "Pitch events downloaded:",
              pitch_events_downloaded,
          )

          print(
              "Pitch events reused:",
              pitch_events_reused,
          )

          print(
              "Saved Pitch event sets:",
              len(
                  result[
                      "pitchEvents"
                  ]
              ),
          )
          PYTHON

      - name: Verify JSON
        run: |
          python -m json.tool public/data/index.json > /dev/null

          echo "Football JSON is valid"

          python <<'PYTHON'
          import json

          with open(
              "public/data/index.json",
              encoding="utf-8",
          ) as file:
              data = json.load(file)

          print(
              "Updated at:",
              data.get("updatedAt")
          )

          print(
              "Competitions:",
              list(
                  data
                  .get(
                      "competitions",
                      {}
                  )
                  .keys()
              )
          )

          pitch_events = (
              data.get(
                  "pitchEvents",
                  {}
              )
          )

          print(
              "Pitch event sets:",
              len(pitch_events)
          )

          event_count = sum(
              len(
                  item.get(
                      "events",
                      []
                  )
              )
              for item
              in pitch_events.values()
          )

          print(
              "Total Pitch events:",
              event_count
          )
          PYTHON

          ls -lh public/data/index.json

      - name: Commit football data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add public/data/index.json

          if git diff --cached --quiet; then
            echo "No football data changes"
            exit 0
          fi

